const save = () => localStorage.setItem(key, JSON.stringify(state));
if (state.records['0-0'] && !state.records['0-0'].tasks) {
  state.records['relations-demo'] = state.records['0-0'];
  delete state.records['0-0'];
  save();
}
for (const item of all) {
  const record = state.records[item.id];
  if (!record) continue;
  if (!record.tasks) state.records[item.id] = {...record, tasks:[record], position:record.passed ? 1 : 0, errors:[...record.errors], passed:false};
  else if (record.passed && record.tasks.length < item.tasks.length) {
    record.position = record.tasks.length;
    record.passed = false;
  }
}
save();
const escape = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function celebrate(button){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelector('.confetti')?.remove();
  const burst = document.createElement('div');
  burst.className = 'confetti';
  burst.setAttribute('aria-hidden', 'true');
  const bounds = button.getBoundingClientRect();
  const colors = ['#603ac8','#f19228','#20a985','#e4578e'];
  for (let index = 0; index < 20; index++) {
    const piece = document.createElement('i');
    const angle = index * Math.PI / 10;
    const distance = 52 + (index % 5) * 19;
    piece.style.left = bounds.left + bounds.width / 2 + 'px';
    piece.style.top = bounds.top + bounds.height / 2 + 'px';
    piece.style.backgroundColor = colors[index % colors.length];
    piece.style.setProperty('--x', Math.cos(angle) * distance + 'px');
    piece.style.setProperty('--y', Math.sin(angle) * distance + 'px');
    piece.style.setProperty('--spin', (index % 2 ? -1 : 1) * 260 + 'deg');
    burst.append(piece);
  }
  document.body.append(burst);
  setTimeout(() => burst.remove(), 700);
}
function addProgress(container, id, label, value, total){
  const progress = document.createElement('div');
  progress.className = 'study-progress';
  progress.innerHTML = `<label for="${id}">${label} · ${value} из ${total}</label><progress id="${id}" value="${value}" max="${total}"></progress>`;
  container.after(progress);
}
function addProgressBackup(){
  const panel = document.createElement('article');
  panel.innerHTML = '<h2>Резервная копия прогресса</h2><div class="row"><button type="button">Скачать прогресс</button><label>Загрузить прогресс<input type="file" accept=".json,application/json"></label></div><p role="status"></p>';
  const status = panel.querySelector('[role=status]');
  panel.querySelector('button').onclick = () => {
    const url = URL.createObjectURL(new Blob([JSON.stringify({version:1, state})], {type:'application/json'}));
    const link = document.createElement('a');
    link.href = url;
    link.download = 'uchus-doma-progress.json';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  panel.querySelector('input').onchange = async event => {
    const file = event.target.files[0];
    if (!file) return;
    try {
      const backup = JSON.parse(await file.text());
      if (backup.version !== 1 || !backup.state?.records || typeof backup.state.records !== 'object') throw Error();
      const records = {...state.records};
      for (const lesson of all) {
        const incoming = backup.state.records[lesson.id];
        if (!incoming) continue;
        if (!Array.isArray(incoming.tasks)) throw Error();
        const current = records[lesson.id];
        const tasks = Array.from({length:lesson.tasks.length}, (_, index) => {
          const saved = incoming.tasks[index];
          const local = current?.tasks[index];
          if (!saved) return local || null;
          if (typeof saved !== 'object' || typeof saved.draft !== 'string' || typeof saved.passed !== 'boolean' || typeof saved.hint !== 'boolean' || typeof saved.feedback !== 'string' || !Array.isArray(saved.errors) || saved.errors.some(error => typeof error !== 'string')) throw Error();
          return {
            ...(local?.draft ? local : saved),
            passed: Boolean(local?.passed || saved.passed),
            hint: Boolean(local?.hint || saved.hint),
            errors: [...new Set([...(local?.errors || []), ...saved.errors])]
          };
        });
        const position = tasks.findIndex(task => !task?.passed);
        records[lesson.id] = {
          tasks, position:position < 0 ? tasks.length - 1 : position, passed:position < 0,
          hint:tasks.some(task => task?.hint),
          errors:tasks.flatMap((task, index) => (task?.errors || []).map(error => lesson.tasks[index].label + ' — ' + error))
        };
      }
      const active = state.active || all.find(lesson => lesson.id === backup.state.active)?.id || null;
      const merged = {records, active};
      localStorage.setItem(key, JSON.stringify(merged));
      state = merged;
      home();
      app.querySelector('#backup-status').textContent = 'Прогресс загружен. Решённые задачи объединены.';
    } catch {
      status.textContent = 'Не удалось загрузить копию. Проверь файл и доступ к хранилищу браузера.';
    } finally {
      event.target.value = '';
    }
  };
  status.id = 'backup-status';
  app.append(panel);
}
function home(){
  const next = all.find(item => item.id === state.active && !state.records[item.id]?.passed) || all.find(item => !state.records[item.id]?.passed);
  const repeat = all.filter(item => state.records[item.id]?.errors.length && !state.records[item.id]?.passed);
  app.innerHTML = `<section class="hero"><strong>6 класс · Семейное обучение</strong><h1>Мой учебный день</h1><p>${all.filter(item => state.records[item.id]?.passed).length} из ${all.length} уроков пройдено</p>${next ? `<button class="primary" data-lesson="${next.id}">${next.id === state.active ? 'Продолжить урок' : 'Следующий урок'}</button>` : 'Все уроки прототипа пройдены.'}</section><h2>Предметы</h2><div class="grid">${courses.map(course => `<section class="card"><span class="icon" aria-hidden="true">${course.icon}</span><h3>${course.name}</h3><p class="muted">${course.section}</p>${all.filter(item => item.course === course).map(item => `<button class="row" data-lesson="${item.id}">${item.title}</button>`).join('')}</section>`).join('')}</div>${repeat.length ? `<article><h2>Стоит повторить</h2>${repeat.map(item => `<button data-lesson="${item.id}">${item.title}</button>`).join(' ')}</article>` : ''}`;
  app.querySelector('.hero p').remove();
  addProgressBackup();
  app.querySelectorAll('.grid .card').forEach((card, index) => {
    const lessons = all.filter(item => item.course === courses[index]);
    const total = lessons.reduce((count, item) => count + item.tasks.length, 0);
    const solved = lessons.reduce((count, item) =>
      count + (state.records[item.id]?.tasks?.filter(attempt => attempt?.passed).length || 0), 0);
    addProgress(card.querySelector('p'), `subject-progress-${index}`, 'Решено задач', solved, total);
  });
}
function attachHintDialog(theory, firstStep, record, lesson = record){
  const dialog = document.createElement('dialog');
  dialog.setAttribute('aria-labelledby', 'theory-title');
  dialog.innerHTML = '<h2 id="theory-title">Подсказка из теории</h2><p></p><p></p><form method="dialog"><button autofocus>Вернуться к задаче</button></form>';
  const [rule, step] = dialog.querySelectorAll('p');
  rule.textContent = theory;
  step.textContent = firstStep;
  app.querySelector('#tip').replaceWith(dialog);
  app.querySelector('#hint').onclick = () => {
    record.hint = lesson.hint = true;
    save();
    dialog.showModal();
  };
}
function openTaskLesson(item, index){
  const lesson = state.records[item.id] ||= {tasks:[], position:0, errors:[], passed:false, hint:false};
  const position = index ?? lesson.position;
  const task = item.tasks[position];
  const answerFormats = [
    'Доля без единиц измерения. Можно ввести дробь (1/3), десятичную дробь (0,25) или процент (25%).',
    'Доля без единиц измерения. Введи дробь (1/3) или процент, округлённый до десятых (33,3%).',
    'Число без единиц измерения. Слова «раза» вводить не нужно. Пример записи: 2,5.',
    'Доля без единиц измерения. Можно ввести дробь (1/8), десятичную дробь (0,125) или процент (12,5%).',
    'Два целых числа через пробел, без слов: сначала число девочек, затем число мальчиков. Пример записи: 15 20.'
  ];
  const attempt = lesson.tasks[position] ||= {draft:'', errors:[], hint:false, passed:false, feedback:''};
  lesson.position = position;
  state.active = item.id;
  save();
  app.innerHTML = `<button id="back">← К предметам</button><article><small>Математика · 6 класс</small><h1>Отношения</h1><p>Прочитай объяснение на с. 119–120. Попробуй решить задачу, затем сравни ход решения.</p><small>${task.label} · ${position + 1} из ${item.tasks.length}</small><form><label for="answer">${task.task}</label><input id="answer" autocomplete="off" required value="${escape(attempt.draft)}"><div class="row"><button class="primary">Проверить</button><button type="button" id="hint">Подсказка</button></div></form><p id="tip" ${attempt.hint ? '' : 'hidden'}>${task.hint}</p><p id="feedback" role="status">${escape(attempt.feedback)}</p><div class="row">${position > 0 ? '<button id="previous">Предыдущая задача</button>' : ''}<button id="continue" ${attempt.passed ? '' : 'hidden'}>${position + 1 < item.tasks.length ? 'Следующая задача' : 'Следующий урок'}</button></div></article>`;
  app.querySelector('article > small').textContent = item.course.name + ' · 6 класс';
  app.querySelector('article > h1').textContent = item.title;
  const reading = app.querySelector('article > p');
  if (item.example) {
    reading.textContent = 'Прочитай в учебнике страницы ' + item.pages + '.';
    const example = document.createElement('p');
    example.className = 'panel';
    example.textContent = 'Разобранный пример: ' + item.example;
    reading.after(example);
  }
  app.querySelector('#back').onclick = home;
  const answerField = app.querySelector('#answer');
  const showTaskProgress = () => {
    app.querySelector('#task-progress')?.parentElement.remove();
    addProgress(app.querySelector('article > p'), 'task-progress', 'Решено задач', lesson.tasks.filter(task => task?.passed).length, item.tasks.length);
  };
  showTaskProgress();
  const format = document.createElement('small');
  format.id = 'answer-format';
  format.textContent = task.format || answerFormats[position];
  answerField.before(format);
  answerField.setAttribute('aria-describedby', format.id);
  const prior = app.querySelector('#previous');
  const theory = [
    'Отношение двух чисел — это частное от их деления. Чтобы узнать, какую часть одно число составляет от другого, раздели первое на второе.',
    'Отношение величин в одинаковых единицах измерения равно отношению их числовых значений. У отношения имеет значение порядок: «часть от целого» означает «часть ÷ целое».',
    'Чтобы узнать, во сколько раз одна величина больше другой, раздели большую величину на меньшую. Если поменять их местами, получится обратное отношение.',
    'Если величины выражены в разных единицах, сначала приведи их к одной единице. В одном килограмме 1000 граммов.',
    'Чтобы разделить общее количество в заданном отношении, сначала сложи числа отношения. Раздели общее количество на эту сумму, чтобы найти одну долю, и умножь её на каждое число отношения.'
  ];
  attachHintDialog(task.theory || theory[position], task.hint, attempt, lesson);
  if (prior) prior.onclick = () => openTaskLesson(item, position - 1);
  app.querySelector('#continue').onclick = () => {
    if (position + 1 < item.tasks.length) openTaskLesson(item, position + 1);
    else {
      const next = all.slice(all.indexOf(item) + 1).find(entry => !state.records[entry.id]?.passed);
      if (next) openLesson(next.id); else home();
    }
  };
  app.querySelector('#answer').oninput = event => { attempt.draft = event.target.value; save(); };
  app.querySelector('form').onsubmit = event => {
    event.preventDefault();
    const answer = attempt.draft.trim().toLowerCase().replace(/,/g,'.').replace(/\s+/g,' ').replace(/\s*([:;/%])\s*/g,'$1');
    if (!answer) return;
    if (task.answers.includes(answer)) {
      celebrate(event.currentTarget.querySelector('.primary'));
      attempt.passed = true;
      attempt.feedback = 'Верно! ' + task.explain;
    } else {
      attempt.errors.push(attempt.draft);
      lesson.errors.push(task.label + ' — ' + attempt.draft);
      attempt.feedback = 'Ответ пока не совпал. ' + task.explain + ' Попробуй ещё раз.';
    }
    lesson.passed = item.tasks.every((_, taskIndex) => lesson.tasks[taskIndex]?.passed);
    save();
    showTaskProgress();
    app.querySelector('#feedback').textContent = attempt.feedback;
    app.querySelector('#continue').hidden = !attempt.passed;
  };
}
function openLesson(id){
  const item = all.find(entry => entry.id === id);
  if (!item) return;
  if (item.tasks) return openTaskLesson(item);
  const record = state.records[id] ||= {draft:'', errors:[], hint:false, passed:false, feedback:''};
  state.active = id;
  save();
  app.innerHTML = `<button id="back">← К предметам</button><article><small>${item.course.name} · 6 класс</small><h1>${item.title}</h1><p>Прочитай в учебнике страницы <strong>${item.pages}</strong>.</p><div class="panel"><h3>Разобранный пример</h3>${item.example}</div><form><label for="answer">${item.task}</label><input id="answer" autocomplete="off" required value="${escape(record.draft)}"><div class="row"><button class="primary">Проверить</button><button type="button" id="hint">Подсказка</button></div></form><p id="tip" ${record.hint ? '' : 'hidden'}>${item.hint}</p><p id="feedback" role="status">${escape(record.feedback)}</p><div id="next" ${record.passed ? '' : 'hidden'}><button class="primary" id="continue">Следующий урок</button></div></article>`;
  app.querySelector('#back').onclick = home;
  app.querySelector('#continue').onclick = () => {
    const next = all.slice(all.indexOf(item) + 1).find(entry => !state.records[entry.id]?.passed);
    if (next) openLesson(next.id); else home();
  };
  app.querySelector('#answer').oninput = event => { record.draft = event.target.value; save(); };
  const theory = {
    '0-1':'Пропорция — это равенство двух отношений. Если второй член отношения увеличивается в несколько раз при сохранении отношения, первый увеличивается во столько же раз.',
    '1-0':'Лексическое значение — это то, что обозначает слово. Если у слова несколько значений, подходящее подсказывают соседние слова.',
    '2-0':'После before you в этом предложении нужен глагол, который называет действие. Подбери глагол по смыслу всего предложения.'
  };
  attachHintDialog(theory[id], item.hint, record);
  app.querySelector('form').onsubmit = event => {
    event.preventDefault();
    const answer = record.draft.toLowerCase().replace(/\s+/g,'').trim();
    if (!answer) return;
    const correct = item.answers.includes(answer);
    if (correct) {
      celebrate(event.currentTarget.querySelector('.primary'));
      record.passed = true;
    } else record.errors.push(record.draft);
    record.feedback = correct ? 'Верно! Урок пройден.' : `${item.explain} Попробуй ещё раз.`;
    save();
    app.querySelector('#feedback').textContent = record.feedback;
    app.querySelector('#next').hidden = !record.passed;
  };
}
function parent(){
  const history = all.filter(item => state.records[item.id]);
  app.innerHTML = `<section class="hero"><small>6 класс · Семейное обучение</small><h1>Кабинет родителя</h1><p>История занятий на этом устройстве</p></section><h2>Результаты уроков</h2>${history.map(item => {const record = state.records[item.id]; return `<article><h3>${item.title}</h3><p>${record.passed ? 'Урок пройден' : 'Урок начат'} · Подсказка ${record.hint ? 'использована' : 'не использована'}</p><p>Ошибки: ${record.errors.map(escape).join(', ') || 'пока нет'}</p></article>`;}).join('') || '<p>Здесь появятся начатые уроки.</p>'}<article><h2>Демо-заявки</h2><p>Подбор дополнительных заданий · 0 ₽ · Новая</p><p>Пробное занятие · 750 ₽ · Рассмотрена</p><small>Пример данных для прототипа</small></article>`;
}
document.querySelector('#student').onclick = home;
document.querySelector('#parent').onclick = parent;
app.addEventListener('click',event => { const button = event.target.closest('[data-lesson]'); if (button) openLesson(button.dataset.lesson); });
home();
</script></html>
